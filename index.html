<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0c14">
  <title>Velvet</title>
  <meta name="description" content="Découvre du contenu exclusif">

  <style>
    :root {
      --bg: #0a0c14;
      --card: #141824;
      --text: #f0f4ff;
      --muted: #8b95b0;
      --accent: #00e5c7;
      --accent2: #c9a227;
      --line: #2a3145;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding-bottom: 200px;
      -webkit-tap-highlight-color: transparent;
    }

    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(10,12,20,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .online {
      font-size: 12px;
      color: #4ade80;
      background: rgba(74,222,128,0.1);
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 600;
    }

    .online::before { content: "●"; margin-right: 6px; font-size: 9px; }

    .notice-wrap {
      padding: 14px 16px;
    }

    .notice {
      background: linear-gradient(135deg, #1a2235, #121826);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 16px 18px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 8px 16px 30px;
    }

    @media (min-width: 540px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      transition: transform .2s;
    }

    .card:active { transform: scale(0.97); }

    .cover {
      position: relative;
      aspect-ratio: 3/4;
      background: #1c2230;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .duration {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: rgba(0,229,199,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-icon::after {
      content: "";
      width: 0;
      height: 0;
      border-left: 16px solid #0a0c14;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      margin-left: 4px;
    }

    .card-body { padding: 14px; }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .likes { color: var(--accent2); font-weight: 600; }

    .action-btn {
      background: linear-gradient(90deg, var(--accent), #00b8a3);
      color: #0a0c14;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 800;
    }

    .float-btn {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0a0c14;
      border: none;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      line-height: 1.1;
      box-shadow: 0 8px 24px rgba(0,229,199,0.35);
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(10,12,20,0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
      padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .bottom-bar button {
      width: 100%;
      max-width: 380px;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      color: #0a0c14;
    }

    .btn-main {
      background: linear-gradient(90deg, var(--accent), #00b8a3);
    }

    .btn-sec {
      background: #1c2230;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .more-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #1a2235, #121826);
      border: 1px solid var(--accent);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">Velvet</div>
    <div class="online" id="onlineCount">18 432 en ligne</div>
  </header>

  <div class="notice-wrap">
    <div class="notice">
      Contenu exclusif mis à jour quotidiennement. Clique pour découvrir.
    </div>
  </div>

  <section class="grid" id="content"></section>

  <button class="float-btn" id="floatBtn" type="button">↓<br>GO</button>

  <div class="bottom-bar">
    <button class="btn-main" id="btnMain" type="button">Accéder au contenu</button>
    <button class="btn-sec" id="btnPlay" type="button">▶ Voir maintenant</button>
    <button class="btn-sec" id="btnChat" type="button">💬 Discuter en privé</button>
  </div>

  <script>
    const NAMES = [
      "Léa","Chloé","Emma","Manon","Camille","Sarah","Julie","Laura",
      "Marine","Clara","Inès","Louise","Anna","Sophie","Mélanie","Élise",
      "Nora","Alicia","Jade","Lina"
    ];

    const ITEMS = [
      {cover:"v01.webp",duration:"12:30"},
      {cover:"v02.webp",duration:"18:45"},
      {cover:"v03.webp",duration:"09:20"},
      {cover:"v04.webp",duration:"22:10"},
      {cover:"v05.webp",duration:"15:55"},
      {cover:"v06.webp",duration:"11:40"},
      {cover:"v07.webp",duration:"27:05"},
      {cover:"v08.webp",duration:"14:25"},
      {cover:"v09.webp",duration:"19:50"},
      {cover:"v10.webp",duration:"08:15"},
      {cover:"v11.webp",duration:"21:30"},
      {cover:"v12.webp",duration:"16:40"},
      {cover:"v13.webp",duration:"13:55"},
      {cover:"v14.webp",duration:"24:10"},
      {cover:"v15.webp",duration:"10:05"},
      {cover:"v16.webp",duration:"17:35"},
      {cover:"v17.webp",duration:"20:20"},
      {cover:"v18.webp",duration:"12:50"},
      {cover:"v19.webp",duration:"15:15"},
      {cover:"v20.webp",duration:"18:00"}
    ];

    function randomOnline() {
      const n = Math.floor(Math.random() * 80000) + 12000;
      return n.toLocaleString("fr-FR") + " en ligne";
    }

    function randomLikes() {
      const n = Math.floor(Math.random() * 30000) + 600;
      return n > 9999 ? (n / 1000).toFixed(1) + "k" : n.toString();
    }

    function handleAction() {
      alert("Fonction en cours de configuration. Remplacez cette alerte par votre propre lien ou logique.");
    }

    function render() {
      const content = document.getElementById("content");
      let html = "";

      ITEMS.forEach((item, i) => {
        html += `
          <article class="card">
            <div class="cover">
              <img src="${item.cover}" alt="" loading="lazy">
              <div class="play-icon"></div>
              <span class="duration">${item.duration}</span>
            </div>
            <div class="card-body">
              <div class="card-title">${NAMES[i % NAMES.length]}</div>
              <div class="card-meta">
                <span class="likes">♥ ${randomLikes()}</span>
                <button class="action-btn" type="button">Voir plus</button>
              </div>
            </div>
          </article>
        `;
      });

      html += `
        <article class="card more-card">
          <div class="card-body" style="padding:32px 18px;text-align:center;">
            <div style="font-size:19px;font-weight:800;margin-bottom:10px;">Encore plus à découvrir</div>
            <div style="font-size:14px;color:var(--muted);margin-bottom:18px;">Débloque tout le contenu</div>
            <button class="action-btn" type="button" style="padding:13px 28px;font-size:15px;">Accéder maintenant</button>
          </div>
        </article>
      `;

      content.innerHTML = html;
    }

    document.getElementById("onlineCount").textContent = randomOnline();
    setInterval(() => {
      document.getElementById("onlineCount").textContent = randomOnline();
    }, 20000);

    document.getElementById("btnMain").addEventListener("click", handleAction);
    document.getElementById("btnPlay").addEventListener("click", handleAction);
    document.getElementById("btnChat").addEventListener("click", handleAction);
    document.getElementById("floatBtn").addEventListener("click", handleAction);

    document.getElementById("content").addEventListener("click", function(e) {
      if (e.target.closest(".card") || e.target.closest(".action-btn")) {
        handleAction();
      }
    });

    render();
  </script>
</body>
</html>
